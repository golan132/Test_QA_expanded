testing:
  sampling:
    measurements_count: 5
    # total_duration_seconds: 60.0 # Uncomment to use duration mode (must comment out measurements_count)
    sampling_frequency_hz: 2.0
    timeout_seconds: 2.0
    acceptable_error_rate: 0.1

ammeters:
  greenlee:
    port: 5000
    command: "MEASURE_GREENLEE -get_measurement"
  entes:
    port: 5001
    command: "MEASURE_ENTES -get_data"
  circutor:
    port: 5002
    command: "MEASURE_CIRCUTOR -get_measurement"

analysis:
  statistical_metrics:
    - "mean"
    - "median"
    - "std_dev"
    - "min"
    - "max"
  visualization:
    enabled: true
    plot_types:
      - "time_series"
      - "histogram"
      - "global_pie_chart"
      - "global_bar_chart"

result_management:
  base_dir: "results/runs"
